name: Tri mails

on:
  schedule:
    - cron: "0 5 * * *"  # tous les jours, 5h UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Simulation (aucun déplacement)"
        type: boolean
        default: true

permissions:
  contents: read

concurrency: mail-sorter

jobs:
  sort:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r mail-sorter/requirements.txt
      - run: python mail-sorter/sort_mail.py
        env:
          MS_CLIENT_ID: ${{ secrets.MS_CLIENT_ID }}
          MS_REFRESH_TOKEN: ${{ secrets.MS_REFRESH_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          EXTRA_RULES_JSON: ${{ secrets.EXTRA_RULES_JSON }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
